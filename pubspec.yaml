name: listd
description: "A Flutter task management app with Google Tasks integration."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Supabase
  supabase_flutter: ^2.3.0

  # Navigation
  go_router: ^14.6.2

  # Authentication
  oauth2: ^2.0.2
  flutter_secure_storage: ^9.2.3

  # Networking
  http: ^1.2.2

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.20.2

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # External
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
